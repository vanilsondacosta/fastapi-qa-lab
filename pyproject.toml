[project]
name = "initially-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "vanilsondacosta",email = "cinzaelithe@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

#configurando o ruff

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]

# Verificar problemas no código
lint = "ruff check ."

# Formatar o código
format = "ruff format ."

# Executar a aplicação FastAPI
run = "fastapi dev initially_zero/app.py"

# Executar testes automatizados
test = "pytest -s -x --cov=initially_zero -vv"
post_test = " coverage html"
pre_test = 'task lint'
pre_format = 'ruff check --fix'